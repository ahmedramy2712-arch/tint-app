<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>tint</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='120' fill='%23c8f542'/%3E%3Cpath fill='%230d0d0f' d='M216 106h80c60 0 110 48 110 108v24c0 60-50 108-110 108h-46l-72 62v-70c-34-18-62-52-62-100v-24c0-60 50-108 100-108z'/%3E%3Ccircle cx='256' cy='226' r='40' fill='%23c8f542'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg:#f6f5f1;--surface:#f6f5f1;--soft:#ebeae4;--text:#0d0d0f;--muted:#8a8a85;--border:#d6d5cf;--theirs:transparent;--theirs-text:#0d0d0f;--acc:#c8f542;--on:#0d0d0f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0c;--surface:#0b0b0c;--soft:#1a1a1c;--text:#f3f2ee;--muted:#76766f;--border:#2c2c30;--theirs-text:#f3f2ee;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0b0c;--surface:#0b0b0c;--soft:#1a1a1c;--text:#f3f2ee;--muted:#76766f;--border:#2c2c30;--theirs-text:#f3f2ee;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.35 "Space Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.01em;display:flex;flex-direction:column;overflow:hidden}
.app{display:flex;flex-direction:column;flex:1;min-height:0;max-width:720px;width:100%;margin:0 auto;background:var(--bg)}
header{display:flex;align-items:center;gap:10px;padding:14px 18px 10px;background:var(--bg)}
.ttl{flex:1;min-width:0}
.logo{width:42px;height:42px;flex:none}
.ttl b{display:block;font-size:28px;font-weight:700;letter-spacing:-.04em;line-height:1.05}
#mood{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);margin-top:3px}
#mood:empty{display:none}
#mood::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--md,#8a8a85);transition:background .8s}
.ib{border:1.5px solid var(--border);background:transparent;color:var(--text);width:42px;height:42px;border-radius:50%;display:grid;place-items:center;cursor:pointer;padding:0;font:inherit}
.ib:hover{background:var(--soft)}
#list{flex:1;overflow-y:auto;padding:8px 16px 8px;display:flex;flex-direction:column;gap:3px;transition:background-color 1s ease}
.row{display:flex;flex-direction:column;max-width:78%}
.row.me{align-self:flex-end;align-items:flex-end}
.row.first{margin-top:10px}
.name{font-size:11px;color:var(--muted);margin:0 12px 3px;text-transform:lowercase}
.bubble{padding:9px 15px;border-radius:22px;white-space:pre-wrap;overflow-wrap:anywhere;font-weight:500}
.bubble.me,.me .bubble{background:var(--acc);color:var(--on);border-bottom-right-radius:6px}
.bubble.them,.them .bubble{background:var(--theirs);color:var(--theirs-text);border:1.5px solid var(--border);padding:7.5px 13.5px;border-bottom-left-radius:6px}
.time{font-size:10px;color:var(--muted);margin:3px 10px 0}
#empty{margin:auto;color:var(--muted);text-align:center;font-size:15px}
form{display:flex;align-items:center;gap:8px;padding:10px 14px 14px;background:var(--bg)}
input{flex:1;min-width:0;padding:13px 18px;border-radius:26px;border:1.5px solid var(--border);background:transparent;color:var(--text);font:inherit}
input::placeholder{color:var(--muted)}
input:focus{outline:0;border-color:var(--text)}
#s{background:var(--acc);color:var(--on);border:0;width:46px;height:46px}
#s:hover{background:var(--acc);filter:brightness(.95)}
#s:disabled{opacity:.4}
#sheet,#rooms{position:fixed;inset:0;z-index:5;display:none;background:rgba(0,0,0,.5);align-items:flex-end;justify-content:center}
#sheet.open,#rooms.open{display:flex}
.panel{width:100%;max-width:720px;background:var(--bg);color:var(--text);border:1.5px solid var(--border);border-bottom:0;border-radius:28px 28px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:88%;overflow-y:auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.ph h2{font-size:24px;margin:0;letter-spacing:-.04em;text-transform:lowercase}
h3{font-size:13px;color:var(--muted);text-transform:lowercase;margin:20px 0 9px;font-weight:600}
.seg{display:flex;background:var(--soft);border-radius:16px;padding:4px}
.seg button{flex:1;border:0;background:transparent;color:var(--text);padding:9px;border-radius:12px;font:inherit;font-size:14px;cursor:pointer;text-transform:lowercase}
.seg button.on{background:var(--text);color:var(--bg);font-weight:600}
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.sw button{border:0;background:transparent;color:var(--text);font:inherit;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:7px;cursor:pointer;padding:0}
.dot{width:52px;height:52px;border-radius:50%;border:1.5px solid var(--border);outline:2.5px solid transparent;outline-offset:3px;transition:outline-color .15s}
.sw button.on .dot{outline-color:var(--text)}
.tg{display:flex;align-items:center;justify-content:space-between;gap:12px}
.tg small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.tg button{flex:none;width:52px;height:32px;border-radius:16px;border:0;background:var(--border);position:relative;cursor:pointer;transition:background .2s}
.tg button::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--bg);transition:transform .2s}
.tg button.on{background:var(--acc)}
.tg button.on::after{transform:translateX(20px);background:var(--on)}
.prev{margin-top:18px;padding:14px;border-radius:20px;background:var(--soft);display:flex;flex-direction:column;gap:5px}
.prev .bubble{width:fit-content;max-width:85%}
.prev .bubble.me{align-self:flex-end}
#welcome{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;background:var(--bg);padding:24px}
#welcome.open{display:flex}
.wc{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px;text-align:center}
.wc .big{font-size:56px;font-weight:700;letter-spacing:-.05em}
.wc p{margin:0;color:var(--muted)}
#wg{border:0;border-radius:26px;padding:14px;background:var(--acc);color:var(--on);font:inherit;font-weight:700;cursor:pointer}
#nm{width:100%}
#rc{display:block;font-size:12px;color:var(--muted);margin-top:3px;letter-spacing:.04em}
#rc:empty{display:none}
.code{font-size:36px;font-weight:700;letter-spacing:.14em;text-align:center;padding:14px;border-radius:20px;background:var(--soft);margin:2px 0 10px}
.btns{display:flex;gap:8px;align-items:center}
.btn{flex:1;border:1.5px solid var(--border);background:transparent;color:var(--text);border-radius:22px;padding:11px 14px;font:inherit;font-weight:600;cursor:pointer;text-transform:lowercase}
.btn.pri{background:var(--acc);color:var(--on);border-color:transparent}
#rl{flex-wrap:wrap}
#rl .btn{flex:0 0 auto}
#joinc{text-transform:uppercase;letter-spacing:.1em}
.pw{position:relative;width:100%}
.pw input{padding-right:54px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;border-radius:50%;padding:0}
.eye.on{color:var(--text)}
.view{display:none;flex-direction:column;flex:1;min-height:0}
.view.on{display:flex}
#v-auth{align-items:center;justify-content:center;padding:24px}
.wc input{width:100%}
.err{color:#ff5a4d;font-size:13px;min-height:18px;margin:0}
.pbtn{border:0;border-radius:26px;padding:14px;background:var(--acc);color:var(--on);font:inherit;font-weight:700;cursor:pointer}
.pbtn:disabled{opacity:.5}
.cl{flex:1;overflow-y:auto;padding:4px 10px;display:flex;flex-direction:column}
.ci{display:flex;align-items:center;gap:12px;padding:10px 8px;border-radius:16px;cursor:pointer;border:0;background:transparent;width:100%;text-align:left;color:var(--text);font:inherit}
.ci:hover{background:var(--soft)}
.av{width:38px;height:38px;border-radius:50%;background:var(--acc);color:var(--on);display:grid;place-items:center;font-weight:700;flex:none}
.ci .av{width:50px;height:50px;font-size:19px}
.ci .tx{min-width:0;flex:1}
.ci b{display:block;font-weight:600}
.ci small{display:block;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.sub:empty{display:none}
#cn{font-size:19px;letter-spacing:-.02em}
.acct{display:flex;align-items:center;justify-content:space-between;gap:12px}
.acct small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.btn.out{flex:none}
</style>
</head>
<body>
<div class="app">

<section class="view" id="v-auth"><div class="wc">
  <div class="big">tint</div><p id="ap">log in to chat</p>
  <div class="seg" id="aseg"><button data-m="in" class="on">log in</button><button data-m="up">sign up</button></div>
  <input type="text" id="an" placeholder="your name" maxlength="24" autocomplete="nickname" style="display:none" aria-label="Your name">
  <input type="email" id="ae" placeholder="email" autocomplete="email" aria-label="Email">
  <div class="pw"><input type="password" id="apw" placeholder="password (6+ characters)" autocomplete="current-password" aria-label="Password"><button type="button" class="eye" id="eye" aria-label="Show password"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
  <p class="err" id="aerr"></p>
  <button class="pbtn" id="ago">log in</button>
</div></section>

<section class="view" id="v-home">
  <header>
    <svg class="logo" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="120" fill="#c8f542"/><path fill="#0d0d0f" d="M216 106h80c60 0 110 48 110 108v24c0 60-50 108-110 108h-46l-72 62v-70c-34-18-62-52-62-100v-24c0-60 50-108 100-108z"/><circle cx="256" cy="226" r="40" fill="#c8f542"/></svg>
    <div class="ttl"><b>tint</b></div>
    <button class="ib" id="rm" aria-label="Add person"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></svg></button>
    <button class="ib" id="gear" aria-label="Settings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <div class="cl" id="cl"></div>
</section>

<section class="view" id="v-chat">
  <header>
    <button class="ib" id="bk" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <div class="av" id="cav"></div>
    <div class="ttl"><b id="cn"></b><span class="sub" id="st"></span></div>
  </header>
  <div id="list"></div>
  <form id="f" autocomplete="off">
    <input type="text" id="t" placeholder="say something…" maxlength="1000" aria-label="Message">
    <button class="ib" id="s" type="submit" aria-label="Send"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6 3.3 10l12.6 2-12.6 2z"/></svg></button>
  </form>
</section>

</div>

<div id="rooms"><div class="panel" role="dialog" aria-label="Add person">
  <div class="ph"><h2>add people</h2><button class="ib" id="rx" aria-label="Close" style="color:var(--text)">✕</button></div>
  <h3>your code</h3><div class="code" id="code">------</div>
  <div class="btns"><button class="btn" id="cp">copy code</button><button class="btn pri" id="sh">share</button></div>
  <h3>add someone with their code</h3>
  <div class="btns"><input type="text" id="joinc" maxlength="6" placeholder="K7M2QX" autocapitalize="characters" aria-label="Their code"><button class="btn pri" id="jn" style="flex:none">add</button></div>
  <p class="err" id="jerr" style="margin-top:8px"></p>
</div></div>

<div id="sheet"><div class="panel" role="dialog" aria-label="Settings">
  <div class="ph"><h2>settings</h2><button class="ib" id="x" aria-label="Close" style="color:var(--text)">✕</button></div>
  <h3>account</h3>
  <div class="acct"><div><b id="acn"></b><small>your code: <span id="acc"></span></small></div><button class="btn out" id="lo">log out</button></div>
  <h3>look</h3>
  <div class="seg" id="seg"><button data-v="system">system</button><button data-v="light">light</button><button data-v="dark">dark</button></div>
  <h3>chat color</h3>
  <div class="sw" id="sw"></div>
  <h3>mood</h3>
  <div class="tg"><div>mood tint<small>background shifts with the vibe</small></div><button id="tint" aria-label="Mood tint"></button></div>
  <div class="prev"><div class="bubble them">hey, you up?</div><div class="bubble me">always. love this theme</div></div>
</div></div>

<script src="firebase-config.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,addDoc,collection,query,orderBy,limit,where,onSnapshot,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

var $=function(i){return document.getElementById(i)},root=document.documentElement,cfg=window.TINT_FIREBASE;
var THEMES=[['Lime','#c8f542','#0d0d0f'],['Lilac','#c5b3ff','#0d0d0f'],['Peach','#ffb59e','#0d0d0f'],['Sky','#9fd6ff','#0d0d0f'],['Bubblegum','#ff9ed2','#0d0d0f'],['Mono','var(--text)','var(--bg)']];
var MOODS={calm:'#7fb8e0',happy:'#f5b82e',love:'#f06292',excited:'#a56ef0',sad:'#5d78a6',angry:'#e5452f'};
var R={love:/❤|💕|😍|🥰|😘|💖|♥|\blove\b|miss you|\bxoxo\b|\bcute\b/gi,happy:/😂|😄|😊|🙂|😁|🤣|\blol\b|haha|\bhappy\b|great|yay|awesome|thanks|nice/gi,excited:/🤩|🥳|🎉|\bomg\b|\bwow\b|excited|let'?s go|!!+|amazing/gi,sad:/😢|😭|☹|💔|🥺|\bsad\b|sorry|\bcry|tired|lonely|\bugh\b/gi,angry:/😡|🤬|😤|\bangry\b|\bmad\b|\bhate\b|annoy|furious|wtf|stupid|shut up/gi};
function detect(t){var b='calm',n=0;for(var k in R){var m=t.match(R[k]);if(m&&m.length>n){n=m.length;b=k}}if(!n&&t.length>5&&t===t.toUpperCase()&&/[A-Z]/.test(t))b='angry';return b}

var S={mode:'system',theme:0,tint:true};
try{var sv=JSON.parse(localStorage.getItem('moodroom')||'null');if(sv)S=Object.assign(S,sv)}catch(e){}
function save(){try{localStorage.setItem('moodroom',JSON.stringify({mode:S.mode,theme:S.theme,tint:S.tint}))}catch(e){}}
function applyTheme(){
  if(S.mode==='system')root.removeAttribute('data-theme');else root.setAttribute('data-theme',S.mode);
  var th=THEMES[S.theme]||THEMES[0];root.style.setProperty('--acc',th[1]);root.style.setProperty('--on',th[2]);
  [].forEach.call($('seg').children,function(b){b.classList.toggle('on',b.dataset.v===S.mode)});
  [].forEach.call($('sw').children,function(b,i){b.classList.toggle('on',i===S.theme)});
  $('tint').classList.toggle('on',S.tint);applyMood();
}
THEMES.forEach(function(th,i){var b=document.createElement('button');b.innerHTML='<span class="dot" style="background:'+th[1]+'"></span>'+th[0].toLowerCase();b.onclick=function(){S.theme=i;save();applyTheme()};$('sw').appendChild(b)});
$('seg').onclick=function(e){var v=e.target.dataset&&e.target.dataset.v;if(v){S.mode=v;save();applyTheme()}};
$('tint').onclick=function(){S.tint=!S.tint;save();applyTheme()};
function sheet(id,open){$(id).classList.toggle('open',open)}
$('gear').onclick=function(){sheet('sheet',true)};$('x').onclick=function(){sheet('sheet',false)};
$('sheet').onclick=function(e){if(e.target===$('sheet'))sheet('sheet',false)};
$('rx').onclick=function(){sheet('rooms',false)};
$('rooms').onclick=function(e){if(e.target===$('rooms'))sheet('rooms',false)};
addEventListener('keydown',function(e){if(e.key==='Escape'){sheet('sheet',false);sheet('rooms',false)}});

var app,auth,db,me=null,chats=[],cur=null,msgs=[],uC=null,uM=null,pendName='',amode='in';
var AERR={'auth/operation-not-allowed':'email sign-in is not turned on in firebase yet','auth/configuration-not-found':'email sign-in is not turned on in firebase yet','auth/invalid-api-key':'the firebase config looks wrong','auth/invalid-credential':'wrong email or password','auth/wrong-password':'wrong email or password','auth/user-not-found':'wrong email or password','auth/email-already-in-use':'that email already has an account','auth/weak-password':'password needs 6+ characters','auth/invalid-email':"that email doesn't look right",'auth/network-request-failed':'no connection','auth/too-many-requests':'too many tries, wait a bit'};
function show(v){['auth','home','chat'].forEach(function(k){$('v-'+k).classList.toggle('on',k===v)})}
function other(c){return c.members.filter(function(u){return u!==me.uid})[0]}
function cname(c){var o=other(c);return (c.names&&c.names[o])||'chat'}
function fmt(ts){try{var d=new Date(ts),n=new Date();return d.toDateString()===n.toDateString()?d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):d.toLocaleDateString([], {month:'short',day:'numeric'})}catch(e){return ''}}
var AL='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
function genCode(){var c='';for(var i=0;i<6;i++)c+=AL[Math.floor(Math.random()*AL.length)];return c}

function applyMood(){
  var k='calm',bs=0,sc={},w=1;
  msgs.slice(-10).reverse().forEach(function(m){var x=m.mood||'calm';sc[x]=(sc[x]||0)+w*(x==='calm'?.4:1);w*=.8});
  for(var x in sc)if(sc[x]>bs){bs=sc[x];k=x}
  var h=MOODS[k],r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
  $('list').style.backgroundColor=S.tint?'rgba('+r+','+g+','+b+',.10)':'transparent';
}
function renderChats(){
  var l=$('cl');l.textContent='';
  if(!chats.length){var e=document.createElement('div');e.id='empty';e.textContent='no chats yet. tap the + person icon and add someone with their code';l.appendChild(e);return}
  chats.forEach(function(c){
    var n=cname(c),b=document.createElement('button');b.className='ci';
    var av=document.createElement('div');av.className='av';av.textContent=n.charAt(0).toUpperCase();
    var tx=document.createElement('div');tx.className='tx';
    var nb=document.createElement('b');nb.textContent=n;var sm=document.createElement('small');sm.textContent=c.last||'say hi';
    tx.appendChild(nb);tx.appendChild(sm);b.appendChild(av);b.appendChild(tx);
    b.onclick=function(){location.hash='#c/'+c.id};l.appendChild(b);
  });
}
function renderMsgs(){
  var list=$('list'),near=list.scrollHeight-list.scrollTop-list.clientHeight<80;
  list.textContent='';
  if(!msgs.length){var e=document.createElement('div');e.id='empty';e.textContent='nobody has said anything yet. be the first ✌️';list.appendChild(e)}
  var last=null;
  msgs.forEach(function(m,i){
    var mine=m.uid===me.uid,first=m.uid!==last,row=document.createElement('div');
    row.className='row '+(mine?'me':'them')+(first?' first':'');
    var b=document.createElement('div');b.className='bubble';b.textContent=m.text;row.appendChild(b);
    var nx=msgs[i+1];
    if(!nx||nx.uid!==m.uid){var tm=document.createElement('div');tm.className='time';tm.textContent=fmt(m.ts);row.appendChild(tm)}
    list.appendChild(row);last=m.uid;
  });
  if(near)list.scrollTop=list.scrollHeight;
  applyMood();
}
function openChat(id){
  var c=chats.filter(function(x){return x.id===id})[0]||{id:id,members:id.split('_'),names:{}};
  var first=!cur||cur.id!==id;cur=c;
  $('cn').textContent=cname(c);$('cav').textContent=cname(c).charAt(0).toUpperCase();
  show('chat');
  if(first){
    msgs=[];renderMsgs();if(uM){uM();uM=null}
    uM=onSnapshot(query(collection(db,'chats',id,'messages'),orderBy('ts','desc'),limit(150)),function(sn){
      msgs=sn.docs.map(function(d){return d.data()}).reverse();renderMsgs();$('list').scrollTop=$('list').scrollHeight;
    },function(){$('st').textContent='could not load messages'});
  }
}
function leaveChat(){if(uM){uM();uM=null}cur=null;msgs=[];show('home')}
function route(){
  if(!me){show('auth');return}
  var h=location.hash;
  if(h.indexOf('#c/')===0)openChat(h.slice(3));else leaveChat();
}
addEventListener('hashchange',route);
$('bk').onclick=function(){if(history.length>1)history.back();else location.hash=''};

$('f').addEventListener('submit',async function(ev){
  ev.preventDefault();
  var text=$('t').value.trim();if(!text||!cur)return;
  $('t').value='';$('st').textContent='';
  var ts=Date.now(),m={uid:me.uid,name:me.name,text:text,ts:ts,mood:detect(text)};
  try{
    await addDoc(collection(db,'chats',cur.id,'messages'),m);
    await updateDoc(doc(db,'chats',cur.id),{last:text.slice(0,80),ts:ts});
  }catch(e){$('t').value=text;$('st').textContent='could not send';setTimeout(function(){$('st').textContent=''},3000)}
});

$('aseg').onclick=function(e){
  var m=e.target.dataset&&e.target.dataset.m;if(!m)return;
  amode=m;[].forEach.call($('aseg').children,function(b){b.classList.toggle('on',b.dataset.m===m)});
  $('an').style.display=m==='up'?'':'none';$('ago').textContent=m==='up'?'create account':'log in';
  $('ap').textContent=m==='up'?'make an account':'log in to chat';$('aerr').textContent='';
  $('apw').autocomplete=m==='up'?'new-password':'current-password';
};
var EYE_ON='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 20C5 20 1 12 1 12a18.5 18.5 0 0 1 5.1-5.9M9.9 4.2A9.1 9.1 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2M1 1l22 22"/></svg>',EYE_OFF='<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
$('eye').onclick=function(){var p=$('apw'),sh=p.type==='password';p.type=sh?'text':'password';this.classList.toggle('on',sh);this.innerHTML=sh?EYE_ON:EYE_OFF;this.setAttribute('aria-label',sh?'Hide password':'Show password')};
$('ago').onclick=async function(){
  var em=$('ae').value.trim(),pw=$('apw').value,nm=$('an').value.trim().slice(0,24),er=$('aerr');er.textContent='';
  if(!auth){er.textContent='setup needed: add your firebase config';return}
  if(amode==='up'&&!nm){er.textContent='pick a name';return}
  if(!em||!pw){er.textContent='enter your email and password';return}
  $('ago').disabled=true;
  try{
    if(amode==='up'){pendName=nm;await createUserWithEmailAndPassword(auth,em,pw)}
    else await signInWithEmailAndPassword(auth,em,pw);
  }catch(e){er.textContent=AERR[e.code]||('something went wrong ('+(e.code||'unknown')+')')}
  finally{$('ago').disabled=false}
};

$('rm').onclick=function(){$('code').textContent=me.code;$('jerr').textContent='';sheet('rooms',true)};
$('cp').onclick=function(){try{navigator.clipboard.writeText(me.code)}catch(e){}var b=$('cp');b.textContent='copied';setTimeout(function(){b.textContent='copy code'},1500)};
$('sh').onclick=function(){var m='add me on tint. my code: '+me.code;if(navigator.share)navigator.share({text:m}).catch(function(){});else{try{navigator.clipboard.writeText(m)}catch(e){}$('sh').textContent='copied';setTimeout(function(){$('sh').textContent='share'},1500)}};
$('joinc').addEventListener('keydown',function(e){if(e.key==='Enter')$('jn').click()});
$('jn').onclick=async function(){
  var code=($('joinc').value||'').toUpperCase().replace(/[^A-Z0-9]/g,''),er=$('jerr');er.textContent='';
  if(code.length!==6){er.textContent='codes are 6 characters';return}
  if(code===me.code){er.textContent="that's your own code";return}
  $('jn').disabled=true;
  try{
    var d=await getDoc(doc(db,'codes',code));
    if(!d.exists()){er.textContent='no one has that code';return}
    var f=d.data(),ids=[me.uid,f.uid].sort(),id=ids.join('_'),names={};names[me.uid]=me.name;names[f.uid]=f.name;
    await setDoc(doc(db,'chats',id),{members:ids,names:names},{merge:true});
    $('joinc').value='';sheet('rooms',false);location.hash='#c/'+id;
  }catch(e){er.textContent='could not add. check your connection'}
  finally{$('jn').disabled=false}
};
$('lo').onclick=function(){sheet('sheet',false);location.hash='';if(auth)signOut(auth)};

async function makeProfile(u,name){
  for(var i=0;i<8;i++){
    var code=genCode();
    try{
      var b=writeBatch(db);
      b.set(doc(db,'codes',code),{uid:u.uid,name:name});
      b.set(doc(db,'users',u.uid),{name:name,code:code});
      await b.commit();return {uid:u.uid,name:name,code:code};
    }catch(e){}
  }
  throw new Error('code');
}

applyTheme();
if(!cfg||!cfg.apiKey||cfg.apiKey.indexOf('PASTE')===0){show('auth');$('aerr').textContent='setup needed: add your firebase config'}
else{
  app=initializeApp(cfg);auth=getAuth(app);db=getFirestore(app);
  onAuthStateChanged(auth,async function(u){
    if(uC){uC();uC=null}if(uM){uM();uM=null}
    if(!u){me=null;chats=[];cur=null;show('auth');return}
    try{
      var d=await getDoc(doc(db,'users',u.uid));
      me=d.exists()?Object.assign({uid:u.uid},d.data()):await makeProfile(u,pendName||(u.email||'me').split('@')[0].slice(0,24));
    }catch(e){$('aerr').textContent=e&&e.code==='permission-denied'?'firebase rules are not set up yet':'could not load your account ('+((e&&e.code)||'error')+')';await signOut(auth);return}
    $('acn').textContent=me.name;$('acc').textContent=me.code;
    uC=onSnapshot(query(collection(db,'chats'),where('members','array-contains',me.uid)),function(sn){
      chats=sn.docs.map(function(d){return Object.assign({id:d.id},d.data())});
      chats.sort(function(a,b){return (b.ts||0)-(a.ts||0)});
      renderChats();
      if(cur){var c=chats.filter(function(x){return x.id===cur.id})[0];if(c){cur=c;$('cn').textContent=cname(c);$('cav').textContent=cname(c).charAt(0).toUpperCase()}}
    },function(){});
    route();
  });
}
</script>
